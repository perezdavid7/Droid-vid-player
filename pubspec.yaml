name: droid_vid_player
description: Offline cross-platform video player (early development).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  video_player: ^2.14.0
  media_kit_libs_video: ^1.0.7
  file_picker: ^13.1.0
  path: ^1.9.1
  ffmpeg_kit_flutter_new_min: ^3.6.7
  gal: ^2.3.3
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.1
  saf: ^2.1.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
