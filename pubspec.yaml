name: droid_vid_player
description: Offline-capable cross-platform video player (experimental).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  image: ^4.12.0
  share_plus: ^12.0.1
  cross_file: ^0.3.5
  ffmpeg_kit_flutter_new: ^4.6.7

flutter:
  uses-material-design: true
